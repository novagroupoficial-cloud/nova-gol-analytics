<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Gol Analytics, analítica del fútbol</title>
  <meta name="description" content="Estadísticas reales de fútbol: récords en casa y fuera, mercados de goles, rachas y rankings de 9 ligas.">
  <meta name="theme-color" content="#0b2a1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b2a1f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23e9b949' stroke-width='2.5'/%3E%3Cpath d='M16 11l4.3 3.1-1.6 5h-5.4l-1.6-5z' fill='%23e9b949'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ===================== PORTADA (sin acceso) ===================== -->
  <div id="portada" hidden>
    <header class="heroe cesped-franjas">
      <svg class="heroe-cal" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="none" stroke="rgba(238,242,234,.22)" stroke-width="3">
          <rect x="30" y="30" width="1140" height="580"/>
          <line x1="600" y1="30" x2="600" y2="610"/>
          <circle cx="600" cy="320" r="110"/>
          <rect x="30" y="170" width="150" height="300"/>
          <rect x="1020" y="170" width="150" height="300"/>
          <path d="M180 260a70 70 0 0 1 0 120M1020 260a70 70 0 0 0 0 120"/>
        </g>
        <circle cx="600" cy="320" r="5" fill="rgba(238,242,234,.35)"/>
      </svg>

      <div class="contenedor">
        <div class="portada-top">
          <a class="marca" href="#">
            <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#e9b949" stroke-width="2.5"/><path d="M16 9.5l5.4 3.9-2 6.3h-6.8l-2-6.3z" fill="#e9b949"/></svg>
            <span class="marca-txt"><b>NOVA <span>GOL</span> ANALYTICS</b><small data-t="lema"></small></span>
          </a>
          <div class="idiomas" role="group" aria-label="Idioma / Language">
            <button type="button" data-idioma="es">ES</button>
            <button type="button" data-idioma="en">EN</button>
            <button type="button" data-idioma="pt">PT</button>
          </div>
        </div>
      </div>

      <div class="contenedor heroe-cuerpo">
        <div>
          <h1 data-t="p.titulo"></h1>
          <p class="lead" data-t="p.lead"></p>
          <div class="heroe-acciones">
            <a class="btn btn-oro js-comprar" href="#planes" data-t="p.comprar"></a>
            <a class="btn" href="#entrar" data-t="p.entrar"></a>
          </div>
        </div>

        <div class="ejemplo">
          <span class="ejemplo-etiqueta" data-t="p.ejemplo"></span>
          <article class="marcador golden" aria-label="Ejemplo">
            <div class="marcador-meta">
              <span class="liga" data-t="p.ligaEj"></span><span>20:00</span>
              <span class="etiquetas"><span class="chip chip-oro" data-t="c.golden"></span></span>
            </div>
            <div class="equipo">
              <div class="equipo-nombre"><span>Club Andino</span></div>
              <div class="lado" data-t="c.local"></div>
              <div class="registro"><b>6-1-0</b></div>
              <div class="forma"><span class="r r-V" data-t="r.V"></span><span class="r r-V" data-t="r.V"></span><span class="r r-E" data-t="r.E"></span><span class="r r-V" data-t="r.V"></span><span class="r r-V" data-t="r.V"></span></div>
            </div>
            <div class="probs">
              <div class="prob alto"><b>96%</b><span data-t="m.o15"></span></div>
              <div class="prob alto"><b>71%</b><span data-t="m.o25"></span></div>
              <div class="prob"><b>29%</b><span data-t="m.u25"></span></div>
              <div class="prob"><b>58%</b><span data-t="m.btts"></span></div>
            </div>
            <div class="equipo visita">
              <div class="equipo-nombre"><span>Atlético Pacífico</span></div>
              <div class="lado" data-t="c.visita"></div>
              <div class="registro"><b>2-1-4</b></div>
              <div class="forma"><span class="r r-D" data-t="r.D"></span><span class="r r-V" data-t="r.V"></span><span class="r r-D" data-t="r.D"></span><span class="r r-E" data-t="r.E"></span><span class="r r-D" data-t="r.D"></span></div>
            </div>
          </article>
        </div>
      </div>
    </header>

    <main class="contenedor secciones">
      <section class="bloque">
        <h2 data-t="p.queVes"></h2>
        <p data-t="p.queVesTxt"></p>
        <div class="rasgos">
          <div class="rasgo"><h3 data-t="p.r1t"></h3><p data-t="p.r1"></p></div>
          <div class="rasgo"><h3 data-t="p.r2t"></h3><p data-t="p.r2"></p></div>
          <div class="rasgo"><h3 data-t="p.r3t"></h3><p data-t="p.r3"></p></div>
        </div>
      </section>

      <section class="bloque" id="historialPublico" hidden>
        <h2 data-t="h.pubTitulo"></h2>
        <p data-t="h.pubTxt"></p>
        <div class="contadores" style="max-width:820px">
          <div class="contador oro"><b class="js-h-pct"></b><span data-t="h.pctGolden"></span></div>
          <div class="contador"><b class="js-h-ac"></b><span data-t="h.aciertos"></span></div>
          <div class="contador"><b class="js-h-fa"></b><span data-t="h.fallos"></span></div>
          <div class="contador"><b class="js-h-desde"></b><span data-t="h.desde"></span></div>
        </div>
      </section>

      <section class="planes" id="planes">
        <div class="plan plan-premium">
          <span class="plan-sello" data-t="p.recomendado"></span>
          <h3 data-t="p.anual"></h3>
          <p class="precio"><b class="js-precio-anual"></b><span data-t="p.porAno"></span></p>
          <p class="sub js-equivale"></p>
          <ul>
            <li data-t="p.f1"></li>
            <li data-t="p.f2"></li>
            <li data-t="p.f3"></li>
            <li data-t="p.f4"></li>
            <li data-t="p.f5"></li>
          </ul>
          <a class="btn btn-oro js-comprar" data-plan="anual" href="#" target="_blank" rel="noopener" data-t="p.comprarAnual"></a>
          <p class="garantia" data-t="p.garantia"></p>
        </div>

        <div class="plan">
          <h3 data-t="p.mensual"></h3>
          <p class="precio"><b class="js-precio-mensual"></b><span data-t="p.porMes"></span></p>
          <p class="sub" data-t="p.mensualSub"></p>
          <a class="btn js-comprar" data-plan="mensual" href="#" target="_blank" rel="noopener" data-t="p.comprarMensual"></a>
          <p class="garantia" data-t="p.garantia"></p>
          <p class="error" id="sinUrl" hidden data-t="p.sinUrl"></p>
        </div>

        <div class="plan" id="entrar">
          <h3 data-t="p.yaTengo"></h3>
          <p class="sub" data-t="p.yaTengoSub"></p>
          <form class="form" id="formEntrar" novalidate>
            <div class="campo">
              <label for="email" data-t="p.correo"></label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="campo">
              <label for="codigo" data-t="p.codigo"></label>
              <input id="codigo" name="codigo" type="text" autocomplete="off" autocapitalize="characters" placeholder="HP0000000000" required>
              <small data-t="p.codigoAyuda"></small>
            </div>
            <p class="error" id="errorEntrar" role="alert"></p>
            <button class="btn btn-oro" type="submit" data-t="p.botonEntrar"></button>
          </form>
        </div>
      </section>
    </main>

    <footer class="pie contenedor">
      <p data-t="pie.legal"></p>
      <p data-t="pie.fuente"></p>
    </footer>
  </div>

  <!-- ===================== APP (con acceso) ===================== -->
  <div id="app" hidden>
    <header class="barra">
      <div class="contenedor barra-in">
        <a class="marca" href="#/partidos">
          <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#e9b949" stroke-width="2.5"/><path d="M16 9.5l5.4 3.9-2 6.3h-6.8l-2-6.3z" fill="#e9b949"/></svg>
          <b>NOVA <span>GOL</span> ANALYTICS</b>
        </a>
        <nav class="nav" aria-label="Principal">
          <a href="#/partidos" data-ruta="partidos" data-t="n.partidos"></a>
          <a href="#/ranking" data-ruta="ranking" data-t="n.rankings"></a>
          <a href="#/historial" data-ruta="historial" data-t="n.historial"></a>
        </nav>
        <div class="barra-der">
          <span class="estado-datos"><span class="punto" id="puntoDatos"></span><span id="estadoDatos" data-t="d.cargando"></span></span>
          <div class="idiomas" role="group" aria-label="Idioma / Language">
            <button type="button" data-idioma="es">ES</button>
            <button type="button" data-idioma="en">EN</button>
            <button type="button" data-idioma="pt">PT</button>
          </div>
          <button class="btn btn-chico" id="salir" type="button" data-t="n.salir"></button>
        </div>
      </div>
    </header>

    <main class="vista contenedor" id="vista" tabindex="-1"></main>

    <footer class="pie contenedor">
      <p data-t="pie.legal"></p>
      <p id="pieFuente" data-t="pie.fuente"></p>
    </footer>
  </div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-caja">
      <div class="modal-cab">
        <div><h2 id="modalTitulo"></h2><p class="nota" id="modalSub"></p></div>
        <button class="cerrar" type="button" id="modalCerrar" aria-label="Cerrar">×</button>
      </div>
      <div id="modalCuerpo"></div>
    </div>
  </div>

  <div id="escenario" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
